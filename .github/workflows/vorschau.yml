# Baut bei jedem Hochladen die Vorschau und veröffentlicht sie auf GitHub Pages.
name: Vorschau auf GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  vorschau:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vorschau bauen
        run: node scripts/build.mjs
        env:
          VORSCHAU: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - id: veroeffentlichen
        uses: actions/deploy-pages@v4
